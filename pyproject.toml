[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"
 
[project]
name = "fsq-agent"
version = "0.1.0"
description = "Goal-driven FSQ automated testing agent built around OpenAI Agents SDK, Azure OpenAI, harness actions, local utilities, observation, and reporting."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Microsoft Corporation" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "openai==2.34.0",
    "openai-agents==0.15.2",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.2",
    "aiofiles==25.1.0",
    "structlog==25.5.0",
    "click==8.3.3",
    "pyyaml==6.0.3",
    "ruamel.yaml==0.18.16",
    "jinja2==3.1.6",
    "uiautomator2==3.5.2",
    "playwright==1.60.0",
    "pywinauto==0.6.9",
    "pillow==12.3.0",
    "Appium-Python-Client==5.3.1",
]

[project.urls]
Documentation = "https://github.com/microsoft/FSQ#readme"
Issues = "https://github.com/microsoft/FSQ/issues"
Repository = "https://github.com/microsoft/FSQ"
 
[project.optional-dependencies]
dev = [
    "pre-commit==4.6.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.1",
]
 
[project.scripts]
fsq = "fsq_agent.adapters.cli:main"
fsq-agent = "fsq_agent.adapters.cli:main"
 
[tool.hatch.build.targets.wheel]
packages = ["fsq_agent"]
artifacts = [
    "fsq_agent/adapters/control_plane/static/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/fsq_agent",
    "/README.md",
    "/README.zh-CN.md",
    "/CHANGELOG.md",
    "/docs/assets/fsq-workflow.svg",
    "/docs/assets/social-preview.png",
    "/docs/assets/social-preview.svg",
    "/docs/case-format.md",
    "/docs/cli-reference.md",
    "/docs/demo.html",
    "/docs/getting-started.md",
    "/docs/getting-started.zh-CN.md",
    "/docs/media",
    "/docs/platform-prerequisites.md",
    "/docs/releases",
    "/docs/support-and-stability.md",
    "/examples",
    "/LICENSE",
    "/pyproject.toml",
]
artifacts = [
    "fsq_agent/adapters/control_plane/static/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
 
[tool.ruff]
required-version = "==0.16.1"
include = ["*.py", "*.pyi"]
line-length = 200
indent-width = 4
target-version = "py311"
preview = false
fix = false
unsafe-fixes = false
show-fixes = true
respect-gitignore = true

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "CPY",
    "DTZ",
    "E",
    "F",
    "G",
    "I",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "ARG001",
    "ARG002",
    "ARG004",
    "ARG005",
    "ASYNC109",
    "ASYNC230",
    "B007",
    "B008",
    "DTZ005",
    "DTZ007",
    "E402",
    "E701",
    "E741",
    "N802",
    "N806",
    "N999",
    "PLC0206",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR1714",
    "PLR2004",
    "PT006",
    "PT009",
    "PTH100",
    "PTH103",
    "PTH107",
    "PTH109",
    "PTH118",
    "PTH120",
    "PTH123",
    "RET503",
    "RET504",
    "SIM102",
    "SIM105",
    "SIM108",
    "TRY003",
]
extend-ignore = [
    "COM812",
    "COM819",
    "E111",
    "E114",
    "E117",
    "E501",
    "ISC001",
    "ISC002",
    "W191",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "Copyright \\(c\\) Microsoft Corporation\\."

[tool.ruff.lint.isort]
known-first-party = ["fsq_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
