[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
 
[project]
name = "fsq-agent"
version = "0.1.0"
description = "Goal-driven FSQ automated testing agent built around OpenAI Agents SDK, Azure OpenAI, harness actions, local utilities, observation, and reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==2.34.0",
    "openai-agents==0.15.2",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.2",
    "aiofiles==25.1.0",
    "structlog==25.5.0",
    "click==8.3.3",
    "pyyaml==6.0.3",
    "ruamel.yaml==0.18.16",
    "jinja2==3.1.6",
    "httpx==0.28.1",
]
 
[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]
android = [
    "uiautomator2==3.5.2",
]
web = [
    "playwright==1.60.0",
]
windows = [
    "pywinauto==0.6.9",
    "pillow==12.3.0",
]
macos = [
    "Appium-Python-Client==2.6.1",
]
 
[project.scripts]
fsq-agent = "fsq_agent.cli:main"
 
[tool.hatch.build.targets.wheel]
packages = ["fsq_agent"]

[tool.hatch.build.targets.wheel.force-include]
"fsq_agent/playground/static" = "fsq_agent/playground/static"
 
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
 
[tool.ruff]
line-length = 100
target-version = "py311"