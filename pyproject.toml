[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
 
[project]
name = "fsq-agent"
version = "0.1.0"
description = "Goal-driven FSQ automated testing agent built around OpenAI Agents SDK, Azure OpenAI, harness actions, local utilities, observation, and reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==2.34.0",
    "openai-agents==0.15.2",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.2",
    "aiofiles==25.1.0",
    "structlog==25.5.0",
    "click==8.3.3",
    "pyyaml==6.0.3",
    "ruamel.yaml==0.18.16",
    "jinja2==3.1.6",
]
 
[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.1",
]
android = [
    "uiautomator2==3.5.2",
]
web = [
    "playwright==1.60.0",
]
windows = [
    "pywinauto==0.6.9",
    "pillow==12.3.0",
]
macos = [
    "Appium-Python-Client==2.6.1",
]
 
[project.scripts]
fsq-agent = "fsq_agent.cli:main"
 
[tool.hatch.build.targets.wheel]
packages = ["fsq_agent"]
artifacts = ["fsq_agent/playground/static/**"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
 
[tool.ruff]
required-version = "==0.16.1"
include = ["*.py", "*.pyi"]
line-length = 200
indent-width = 4
target-version = "py311"
preview = false
fix = false
unsafe-fixes = false
show-fixes = true
respect-gitignore = true

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "CPY",
    "DTZ",
    "E",
    "F",
    "G",
    "I",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "ARG001",
    "ARG002",
    "ARG004",
    "ARG005",
    "ASYNC109",
    "ASYNC230",
    "B007",
    "B008",
    "DTZ005",
    "DTZ007",
    "E402",
    "E701",
    "E741",
    "N802",
    "N806",
    "N999",
    "PLC0206",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR1714",
    "PLR2004",
    "PT006",
    "PT009",
    "PTH100",
    "PTH103",
    "PTH107",
    "PTH109",
    "PTH118",
    "PTH120",
    "PTH123",
    "RET503",
    "RET504",
    "SIM102",
    "SIM105",
    "SIM108",
    "TRY003",
]
extend-ignore = [
    "COM812",
    "COM819",
    "E111",
    "E114",
    "E117",
    "E501",
    "ISC001",
    "ISC002",
    "W191",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "Copyright \\(c\\) Microsoft Corporation\\."

[tool.ruff.lint.isort]
known-first-party = ["fsq_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"