<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSQ Evidence Demo</title>

<body><small>FSQ · Public evidence example</small><h1>Sample store</h1><main><h2>Field notebook</h2><p>A demo product. No payment or account is required.</p><p><strong>$8.00</strong></p><button id="add" type="button">Add to cart</button><p id="status" role="status">Your cart is empty.</p></main><footer>Inspect the recorded action, UI change, and assertion in the FSQ Run report.</footer>
