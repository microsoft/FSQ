openai_agents:
  max_turns: 50
  tracing_enabled: true

harness:
  platform: macos
  macos:
    backend: appium_mac2
    appium_server_url: http://127.0.0.1:4723
    page_source_max_depth: 12
    action_timeout_seconds: 10
    new_command_timeout_seconds: 300

execution:
  post_action_delay_seconds:
    platform: 1.0
    common: 0.0

agent_context:
  knowledge:
    skills:
      items:
        - name: automation-basics
          description: Semantic action and evidence guidance for local runs.
          kind: markdown
          path: automation-basics.md
          required: true
        - name: macos-harness
          description: macOS Appium Mac2 harness action selection and recovery guidance.
          kind: markdown
          path: macos-harness.md
          required: true