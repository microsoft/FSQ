# Reference-only configuration example.
#
# Public CLI platform runs use the sibling config.android.yaml,
# config.web.yaml, config.windows.yaml, or config.macos.yaml presets. This
# file is not a runtime preset and is ignored by default config discovery.
# Copy pieces from here into a local config.yaml when experimenting manually.

openai_agents:
  max_turns: 100
  tracing_enabled: true

harness:
  platform: android
  android:
    backend: uiautomator2
    # Android devices are selected per run; serial is not persisted here.

execution:
  post_action_delay_seconds:
    platform: 1.0
    common: 0.0

# Optional strict case lifecycle hooks.
# Execution order is:
# config onCaseStart -> case onCaseStart -> case commands -> case onCaseComplete -> config onCaseComplete
caseLifecycle:
  onCaseStart:
    - runCase: hooks/common-before.fsq.yaml
    - runShell: echo config before
  onCaseComplete:
    - runShell: echo config after

runtime_secrets:
  allowed_env_names:
    - TEST_ACCOUNT_EMAIL
    - TEST_ACCOUNT_PASSWORD

agent_context:
  knowledge:
    root_dir: ../../knowledge/project_android_v1
    skills:
      dir: ../../fsq_agent/resources/skills
      items:
        - name: automation-basics
          description: Semantic action and evidence guidance for local runs.
          kind: markdown
          path: automation-basics.md
          required: true
    pre_plan:
          dir: .