openai_agents:
  max_turns: 50
  tracing_enabled: true

harness:
  platform: web
  web:
    backend: playwright
    channel: chrome
    headless: false
    base_url: null

execution:
  post_action_delay_seconds:
    platform: 1.0
    common: 0.0

agent_context:
  knowledge:
    skills:
      items:
        - name: automation-basics
          description: Semantic action and evidence guidance for local runs.
          kind: markdown
          path: automation-basics.md
          required: true
        - name: web-harness
          description: Web harness action selection and recovery guidance.
          kind: markdown
          path: web-harness.md
          required: true