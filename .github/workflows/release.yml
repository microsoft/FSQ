name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified distributions to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Complete release verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: uv sync --extra dev --reinstall-package fsq-agent

      - name: Run Python quality and tests
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync python -m pytest

      - name: Verify frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build distributions
        run: uv build

      - name: Verify distributions
        run: |
          uvx twine check dist/*
          uv run --no-sync python -m pytest tests/test_distribution_contract.py

      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/fsq-release-smoke"
          uv pip install --python "$RUNNER_TEMP/fsq-release-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/fsq-release-smoke/bin/fsq" --help
          "$RUNNER_TEMP/fsq-release-smoke/bin/fsq-agent" --help
          "$RUNNER_TEMP/fsq-release-smoke/bin/python" - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from fsq_agent.adapters.control_plane import ControlPlaneServer, ControlPlaneServerOptions
          from fsq_agent.config import PLATFORM_CONFIG_PATHS, load_platform_settings

          with TemporaryDirectory() as temp_dir:
              temp_root = Path(temp_dir)
              for platform, preset_path in PLATFORM_CONFIG_PATHS.items():
                  assert preset_path.is_file()
                  settings = load_platform_settings(
                      platform,
                      workspace=temp_root / platform,
                      user_config_root=temp_root / "user",
                  )
                  skills = settings.agent_context.knowledge.skills
                  assert all(item.path is not None and (skills.dir / item.path).is_file() for item in skills.items)

          server = ControlPlaneServer(ControlPlaneServerOptions(open_browser=False))
          status, body, content_type = server.static_response("/")
          assert status == 200
          assert body
          assert content_type.startswith("text/html")
          PY

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/

      - name: Install wheel and verify console scripts
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "fsq-install-smoke"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) {
            throw "Virtual environment creation failed with exit code $LASTEXITCODE."
          }
          if ($IsWindows) {
            $python = Join-Path $venv "Scripts/python.exe"
            $fsq = Join-Path $venv "Scripts/fsq.exe"
            $fsqAgent = Join-Path $venv "Scripts/fsq-agent.exe"
          } else {
            $python = Join-Path $venv "bin/python"
            $fsq = Join-Path $venv "bin/fsq"
            $fsqAgent = Join-Path $venv "bin/fsq-agent"
          }
          $wheels = @(Get-ChildItem -Path dist -Filter "*.whl")
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel in dist/, found $($wheels.Count)."
          }
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "pip upgrade failed with exit code $LASTEXITCODE."
          }
          & $python -m pip install $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Wheel installation failed with exit code $LASTEXITCODE."
          }
          & $python -c "import fsq_agent"
          if ($LASTEXITCODE -ne 0) {
            throw "Installed package import failed with exit code $LASTEXITCODE."
          }
          & $fsq --help
          if ($LASTEXITCODE -ne 0) {
            throw "fsq console-script smoke failed with exit code $LASTEXITCODE."
          }
          & $fsqAgent --help
          if ($LASTEXITCODE -ne 0) {
            throw "fsq-agent console-script smoke failed with exit code $LASTEXITCODE."
          }
          $resourceSmoke = @'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from fsq_agent.config import PLATFORM_CONFIG_PATHS, load_platform_settings

          with TemporaryDirectory() as temp_dir:
              temp_root = Path(temp_dir)
              for platform, preset_path in PLATFORM_CONFIG_PATHS.items():
                  assert preset_path.is_file()
                  settings = load_platform_settings(
                      platform,
                      workspace=temp_root / platform,
                      user_config_root=temp_root / "user",
                  )
                  skills = settings.agent_context.knowledge.skills
                  assert all(item.path is not None and (skills.dir / item.path).is_file() for item in skills.items)
          '@
          $resourceSmoke | & $python -
          if ($LASTEXITCODE -ne 0) {
            throw "Installed package resource smoke failed with exit code $LASTEXITCODE."
          }

  publish:
    name: Publish to PyPI
    if: ${{ inputs.publish }}
    needs:
      - verify
      - install-smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
