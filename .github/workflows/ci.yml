name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Verify clean checkout package resource ownership
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          tracked_lock = subprocess.run(
              ["git", "ls-files", "--error-unmatch", "uv.lock"],
              capture_output=True,
              check=False,
          )
          if tracked_lock.returncode == 0:
              raise SystemExit("uv.lock must not be tracked")

          generated = (
              Path("fsq_agent/adapters/control_plane/static"),
          )
          present = [str(path) for path in generated if path.exists()]
          if present:
              raise SystemExit(f"Generated package resources are unexpectedly tracked: {present}")

          package_resources = (
              Path("fsq_agent/config/config.android.yaml"),
              Path("fsq_agent/config/config.web.yaml"),
              Path("fsq_agent/config/config.windows.yaml"),
              Path("fsq_agent/config/config.macos.yaml"),
              Path("fsq_agent/config/config.example.yaml"),
              Path("fsq_agent/resources/skills/android-harness.md"),
              Path("fsq_agent/resources/skills/web-harness.md"),
              Path("fsq_agent/resources/skills/windows-harness.md"),
              Path("fsq_agent/resources/skills/macos-harness.md"),
              Path("fsq_agent/resources/skills/automation-basics.md"),
          )
          missing = [str(path) for path in package_resources if not path.is_file()]
          if missing:
              raise SystemExit(f"Tracked package resources are missing: {missing}")

          retired = (
              Path("config.android.yaml"),
              Path("config.web.yaml"),
              Path("config.windows.yaml"),
              Path("config.macos.yaml"),
              Path("config.example.yaml"),
              Path("knowledge/skills"),
          )
          present = [str(path) for path in retired if path.exists()]
          if present:
              raise SystemExit(f"Retired root resources are still present: {present}")

      - name: Install quality dependencies
        run: uv sync --extra dev --reinstall-package fsq-agent

      - name: Run Ruff lint
        run: uv run --no-sync ruff check .

      - name: Run Ruff format check
        run: uv run --no-sync ruff format --check .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Verify clean checkout package resource ownership
        shell: python
        run: |
          from pathlib import Path

          generated = (
              Path("fsq_agent/adapters/control_plane/static"),
          )
          present = [str(path) for path in generated if path.exists()]
          if present:
              raise SystemExit(f"Generated package resources are unexpectedly tracked: {present}")

          package_resources = (
            Path("fsq_agent/config/config.android.yaml"),
            Path("fsq_agent/config/config.web.yaml"),
            Path("fsq_agent/config/config.windows.yaml"),
            Path("fsq_agent/config/config.macos.yaml"),
            Path("fsq_agent/config/config.example.yaml"),
            Path("fsq_agent/resources/skills/android-harness.md"),
            Path("fsq_agent/resources/skills/web-harness.md"),
            Path("fsq_agent/resources/skills/windows-harness.md"),
            Path("fsq_agent/resources/skills/macos-harness.md"),
            Path("fsq_agent/resources/skills/automation-basics.md"),
          )
          missing = [str(path) for path in package_resources if not path.is_file()]
          if missing:
            raise SystemExit(f"Tracked package resources are missing: {missing}")

          retired = (
            Path("config.android.yaml"),
            Path("config.web.yaml"),
            Path("config.windows.yaml"),
            Path("config.macos.yaml"),
            Path("config.example.yaml"),
            Path("knowledge/skills"),
          )
          present = [str(path) for path in retired if path.exists()]
          if present:
            raise SystemExit(f"Retired root resources are still present: {present}")

      - name: Install test dependencies
        run: uv sync --all-extras --reinstall-package fsq-agent

      - name: Run test suite
        run: uv run --no-sync python -m pytest

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "22"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build distributions
        run: uv build

      - name: Rebuild wheel from source distribution
        shell: bash
        run: uv build --wheel dist/*.tar.gz --out-dir rebuilt-dist

      - name: Verify distribution contracts
        shell: python
        run: |
          import email
          import re
          import tarfile
          from pathlib import Path
          from zipfile import ZipFile

          def canonicalize_name(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          wheels = list(Path("dist").glob("*.whl"))
          rebuilt_wheels = list(Path("rebuilt-dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(rebuilt_wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel, one rebuilt wheel, and one sdist, found "
                  f"{wheels=} {rebuilt_wheels=} {sdists=}"
              )

          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              entry_points_name = next(name for name in names if name.endswith(".dist-info/entry_points.txt"))
              metadata = email.message_from_bytes(archive.read(metadata_name))
              entry_points = archive.read(entry_points_name).decode()

          required_prefixes = (
              "fsq_agent/adapters/control_plane/static/",
          )
          required_files = (
              "fsq_agent/adapters/control_plane/static/control-plane/index.html",
              "fsq_agent/adapters/control_plane/static/entry-assets.json",
              "fsq_agent/config/config.android.yaml",
              "fsq_agent/config/config.web.yaml",
              "fsq_agent/config/config.windows.yaml",
              "fsq_agent/config/config.macos.yaml",
              "fsq_agent/config/config.example.yaml",
              "fsq_agent/resources/skills/android-harness.md",
              "fsq_agent/resources/skills/web-harness.md",
              "fsq_agent/resources/skills/windows-harness.md",
              "fsq_agent/resources/skills/macos-harness.md",
              "fsq_agent/resources/skills/automation-basics.md",
              "fsq_agent/agent/templates/agent_instructions.j2",
              "fsq_agent/agent/templates/task_input.j2",
          )
          for path in required_files:
              if path not in names:
                  raise SystemExit(f"Wheel is missing {path}")
          for prefix in required_prefixes:
              for suffix in (".js", ".css"):
                  if not any(name.startswith(prefix) and name.endswith(suffix) for name in names):
                      raise SystemExit(f"Wheel has no {suffix} file under {prefix}")

          with ZipFile(rebuilt_wheels[0]) as archive:
              rebuilt_names = set(archive.namelist())
          runtime_prefixes = (
              "fsq_agent/config/config.",
              "fsq_agent/resources/skills/",
              *required_prefixes,
          )
          required_runtime_names = {
              name for name in names if name.startswith(runtime_prefixes)
          }
          rebuilt_runtime_names = {
              name for name in rebuilt_names if name.startswith(runtime_prefixes)
          }
          if rebuilt_runtime_names != required_runtime_names:
              raise SystemExit("Wheel rebuilt from sdist has different runtime package resources")

          retired_wheel_resources = {
              name
              for name in names
              if name.startswith("fsq_agent/resources/knowledge/")
              or name
              in {
                  "fsq_agent/resources/config.android.yaml",
                  "fsq_agent/resources/config.web.yaml",
                  "fsq_agent/resources/config.windows.yaml",
                  "fsq_agent/resources/config.macos.yaml",
              }
          }
          if retired_wheel_resources:
              raise SystemExit(f"Wheel contains retired package resource: {sorted(retired_wheel_resources)}")

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_names = {name.split("/", 1)[-1] for name in archive.getnames()}
          for path in required_files:
              if path not in sdist_names:
                  raise SystemExit(f"Sdist is missing {path}")
          retired_sdist_resources = {
              name
              for name in sdist_names
              if name.startswith("knowledge/skills/")
              or name
              in {
                  "config.android.yaml",
                  "config.web.yaml",
                  "config.windows.yaml",
                  "config.macos.yaml",
                  "config.example.yaml",
              }
          }
          if retired_sdist_resources:
              raise SystemExit(f"Sdist contains retired root resource: {sorted(retired_sdist_resources)}")
          for prefix in required_prefixes:
              for suffix in (".js", ".css"):
                  if not any(name.startswith(prefix) and name.endswith(suffix) for name in sdist_names):
                      raise SystemExit(f"Sdist has no {suffix} file under {prefix}")

          expected_dependencies = (
              "uiautomator2==",
              "playwright==",
              "pywinauto==",
              "Appium-Python-Client==",
              "pillow==",
          )
          dependencies = metadata.get_all("Requires-Dist", [])
          for expected in expected_dependencies:
              expected_name = canonicalize_name(expected.removesuffix("=="))
              if not any(
                  canonicalize_name(item.split(" ", 1)[0].split("==", 1)[0]) == expected_name
                  and "extra ==" not in item
                  for item in dependencies
              ):
                  raise SystemExit(f"Missing default dependency {expected}")
          if metadata.get_all("Provides-Extra", []) != ["dev"]:
              raise SystemExit(f"Unexpected extras: {metadata.get_all('Provides-Extra', [])}")
          for script in ("fsq = fsq_agent.adapters.cli:main", "fsq-agent = fsq_agent.adapters.cli:main"):
              if script not in entry_points:
                  raise SystemExit(f"Missing console script: {script}")

      - name: Install wheel in isolation
        shell: bash
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/fsq-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/fsq-wheel-smoke/bin/python" dist/*.whl

      - name: Smoke test installed wheel
        shell: bash
        run: |
          "$RUNNER_TEMP/fsq-wheel-smoke/bin/python" -c "import fsq_agent"
          "$RUNNER_TEMP/fsq-wheel-smoke/bin/fsq" --help
          "$RUNNER_TEMP/fsq-wheel-smoke/bin/fsq-agent" --help
          "$RUNNER_TEMP/fsq-wheel-smoke/bin/python" - <<'PY'
          from fsq_agent.adapters.control_plane import ControlPlaneServer, ControlPlaneServerOptions

          server = ControlPlaneServer(ControlPlaneServerOptions(open_browser=False))
          status, body, content_type = server.static_response("/")
          assert status == 200
          assert body
          assert content_type.startswith("text/html")
          PY

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quality
      - tests
      - frontend
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          printf 'Quality: %s\nTests: %s\nFrontend: %s\nPackage: %s\n' \
            "$QUALITY_RESULT" "$TESTS_RESULT" "$FRONTEND_RESULT" "$PACKAGE_RESULT"
          for result in "$QUALITY_RESULT" "$TESTS_RESULT" "$FRONTEND_RESULT" "$PACKAGE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
